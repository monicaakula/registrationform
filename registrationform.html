<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login & Registration</title>
<link rel="stylesheet" href="registrationform.css">
</head>
<body>
<div class="form-container">
Student Registration
<form id="registrationForm" novalidate>
<div class="form-group">
<label for="fullName">Full Name</label>
<input type="text" id="fullName" placeholder="Enter your full name">
</div>
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" placeholder="Enter your email">
</div>
<div class="form-group">
<label for="phone">Phone Number</label>
<input type="tel" maxlength="10" id="phone" placeholder="10-digit mobile number">
</div>
<div class="form-group">
<label for="course">Select Course</label>
<select id="course">
<option value="" selected>Choose a course</option>
<option value="Computer Science">Computer Science</option>
<option value="Information Technology">Information Technology</option>
<option value="Business Administration">Business Administration</option>
<option value="Engineering">Engineering</option>
<select>
</div>
<div class="form-group">
<label for="password">Password</label>
<div class="password-wrapper">
<input type="password" id="password" placeholder="Create a password">
<i class="fas fa-eye toggle-password" id="togglePassword"></i>
</div>
<div class="form-group">
<label for="confirmPassword">Confirm Password</label>
<div class="password-wrapper">
<input type="password" id="confirmPassword" placeholder="Confirm your password">
<i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
</div>
</div>
<div id="statusMessage"></div>
<button type="submit" class="submit-btn">Login</button>
</form>
<div id="dataDisplay" class="data-display" style="display: none;"></div>
</div>
<script src="registrationform.js"></script>
</body>
</html>
